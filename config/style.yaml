# Visual, voice and caption style for every episode.
# Changing anything here changes the whole channel's look — edit deliberately.

channel:
  language: kn            # narration language
  target_minutes: 20      # acceptable range is 15–25
  min_minutes: 15
  max_minutes: 25
  scenes: 100             # ~12s each
  acts: 8                 # script is generated act by act, not in one call
  # MEASURED, not guessed: 475 characters of Kannada read by kn-IN-GaganNeural
  # at rate -8% came out at 46.0s on a real render (8 Nov 2026). The first
  # estimate of 13.0 would have produced a 25-minute episode from a 20-minute
  # budget. Re-measure if you change the voice or the rate.
  chars_per_second: 10.3

visual:
  width: 1920
  height: 1080
  fps: 30
  # Appended to every image prompt so all shots in all episodes grade alike.
  style_suffix: >-
    cinematic film still, 16:9, shot on 35mm anamorphic, shallow depth of field,
    warm earthy desaturated palette, dust motes in volumetric light, soft golden
    hour haze, historically accurate Indian setting, no text, no watermark,
    photorealistic
  negative: >-
    modern clothing in historical scenes, cartoon, anime, illustration, text,
    watermark, signature, deformed hands, extra fingers, blurry, low quality
  # Camera motion applied in ffmpeg. A scene longer than split_after seconds is
  # cut into two moves on the same image, so the picture changes every few
  # seconds even though one image covers the whole scene.
  motion:
    zoom_per_second: 0.012
    split_after: 9.0
    moves: [push_in, pull_out, pan_left, pan_right]
  # One image per scene. Pairing scenes to save images was tried and dropped:
  # the second scene's narration then plays over the first scene's picture,
  # and on the 9 Nov sample that put a line about a carved stone at Begur
  # over a field of cattle. Pollinations is rate limited rather than capped,
  # so a fresh image per scene costs only time.
  scenes_per_image: 1
  # Trim the outer edge before the camera move. Generated images sometimes
  # carry a provider watermark in a corner (Pollinations does, even with
  # nologo=true); this crops it off rather than publishing it.
  edge_trim: 0.07
  # Film grain sells the "shot on film" look, but random noise is the worst
  # case for video compression: at strength 5 a 47s test came out at 64MB,
  # which extrapolates to ~1.6GB for a 20-minute episode. 2 keeps the
  # texture at a fraction of the bitrate. 0 disables it.
  grain: 2
  crf: 21
  # Pollinations needs no key at all, which is why it leads. Its 402s are
  # rate limiting, not a paywall: a 9 Nov 2026 probe showed model=flux
  # returning 200 while back-to-back calls get 402, hence request_delay.
  # Set primary to cloudflare once CF_ACCOUNT_ID and CF_API_TOKEN exist —
  # it is faster and has no limiter at this volume, just a 57/day ceiling.
  providers:
    primary: pollinations
    primary_budget: 999
    secondary: none
    request_delay: 8

voice:
  provider: edge          # edge (free) | elevenlabs | google
  edge_voice: kn-IN-GaganNeural
  edge_rate: "-8%"
  edge_pitch: "-2Hz"
  elevenlabs_model: eleven_multilingual_v2
  google_voice: kn-IN-Chirp3-HD-Achernar

captions:
  font: Noto Sans Kannada
  size: 54
  max_chars: 42
  max_lines: 2
  margin_v: 96

audio:
  music_db: -22.0
  target_lufs: -14.0
  scene_pad: 0.35         # silence after each line, seconds

upload:
  category_id: "27"       # Education
  privacy: private        # flip to "public" once you trust the output
  made_for_kids: false
