name: Sample render (no secrets needed)

# Builds a ~35 second sample using only the keyless providers — Pollinations
# for images, edge-tts for the Kannada voice. Run this before setting up any
# API keys, to see what the finished product actually looks and sounds like.
# Download the result from the run's Artifacts section.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Kannada fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-unhinted
          fc-list | grep -qi kannada || { echo "No Kannada font installed"; exit 1; }

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the sample
        run: python src/make_sample.py

      - name: Upload the sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-render
          path: |
            episodes/sample/final.mp4
            episodes/sample/thumbnail.jpg
            episodes/sample/images/*.png
          if-no-files-found: error
          retention-days: 14

      # Artifacts are served from Azure storage, which some clients cannot
      # reach. Pushing the same files to an orphan branch makes them
      # fetchable over plain git from anywhere, and keeps them out of main's
      # history — the branch is replaced wholesale on every run.
      - name: Publish the sample to the sample-output branch
        if: success()
        run: |
          SIZE=$(du -m episodes/sample/final.mp4 | cut -f1)
          if [ "$SIZE" -gt 60 ]; then
            echo "final.mp4 is ${SIZE}MB — too large for a git branch, skipping"
            exit 0
          fi
          mkdir -p /tmp/out
          cp episodes/sample/final.mp4 episodes/sample/thumbnail.jpg /tmp/out/
          git config user.name  "youtube-automation"
          git config user.email "actions@github.com"
          git checkout --orphan sample-output
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +
          cp /tmp/out/* .
          echo "Sample render from run ${GITHUB_RUN_ID}. Replaced on every run." > README.md
          git add -A
          git commit -q -m "sample render from run ${GITHUB_RUN_ID}"
          git push -f origin sample-output
          echo "pushed ${SIZE}MB to sample-output"
